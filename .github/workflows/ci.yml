name: CI

on:
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GroupMigrationSchemaTest 등 Testcontainers 테스트는 러너의 Docker를 사용한다.
      - name: Test
        run: ./gradlew test
