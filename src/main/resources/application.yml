spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 켜두면 SSE 연결이 끊길 때까지 DB 커넥션을 반납하지 않아 풀이 고갈된다
    open-in-view: false

  # 스키마는 Flyway 마이그레이션만으로 바꾼다. 이미 테이블이 있는 DB는 V1(운영 스키마 덤프)으로 기준선만 찍고 V2부터 적용한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: fryday-scheduler-

server:
  tomcat:
    # Tomcat 스레드와 연결 수 지표(tomcat_threads_*, tomcat_connections_*)를 내보내려면 켜야 한다
    mbeanregistry:
      enabled: true

management:
  metrics:
    distribution:
      # p95, p99 를 Prometheus 에서 계산할 수 있도록 응답 시간 히스토그램 버킷을 내보낸다.
      # percentiles-histogram 은 버킷이 50개 가까이라 시계열이 많아져, 경계를 직접 정한다
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,200ms,300ms,500ms,750ms,1s,2s,5s,10s

jwt:
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1296000000}

oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID:com.example.app}
    jwks-url: https://appleid.apple.com/auth/keys

fcm:
  enabled: ${FCM_ENABLED:false}
  credentials:
    json: ${FCM_CREDENTIALS_JSON:#{null}}

docs:
  security:
    username: ${DOCS_USER:1111}
    password: ${DOCS_PASSWORD:1111}

admin:
  api-key: ${ADMIN_API_KEY:#{null}}
  jwt:
    secret-key: ${ADMIN_JWT_SECRET_KEY}
    access-token-expiration: ${ADMIN_JWT_ACCESS_TOKEN_EXPIRATION:43200000}
