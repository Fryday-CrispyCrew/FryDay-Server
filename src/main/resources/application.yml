spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 켜두면 SSE 연결이 끊길 때까지 DB 커넥션을 반납하지 않아 풀이 고갈된다
    open-in-view: false

  # 스키마는 Flyway 마이그레이션만으로 바꾼다. 이미 테이블이 있는 DB는 V1(운영 스키마 덤프)으로 기준선만 찍고 V2부터 적용한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: fryday-scheduler-

jwt:
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1296000000}

oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID:com.example.app}
    jwks-url: https://appleid.apple.com/auth/keys

fcm:
  enabled: ${FCM_ENABLED:false}
  credentials:
    json: ${FCM_CREDENTIALS_JSON:#{null}}

docs:
  security:
    username: ${DOCS_USER:1111}
    password: ${DOCS_PASSWORD:1111}

admin:
  api-key: ${ADMIN_API_KEY:#{null}}
