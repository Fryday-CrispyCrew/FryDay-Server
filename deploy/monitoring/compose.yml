# 기존 ~/monitoring/docker-compose.yml 을 옮긴 것. 적용 방법은 README.md 참고
name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      # 수집 대상 주소(prometheus/targets/)는 서버에만 둔다
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      # 로그인이 없으니 서버 안에서만 연다. Grafana 는 compose 네트워크(http://prometheus:9090)로 붙는다
      - "127.0.0.1:9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    # GF_SECURITY_ADMIN_PASSWORD, GF_SERVER_ROOT_URL, DISCORD_WEBHOOK_URL
    env_file: .env
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      # 서버에 있는 설정을 그대로 쓴다
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

volumes:
  # 기존 Prometheus 는 이름 없는 볼륨을 써서, 적용할 때 한 번 데이터를 옮긴다 (README.md)
  prometheus-data:
    name: fryday-prometheus-data
