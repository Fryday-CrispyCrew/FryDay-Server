name: fryday-prod

services:
  app:
    image: ghcr.io/fryday-crispycrew/fryday:${APP_TAG:-prod}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    # 같은 서버의 nginx가 프록시하므로 루프백에만 연다.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /home/ubuntu/logs/prod:/home/ubuntu/logs/prod
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
